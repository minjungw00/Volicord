[package]
name = "volicord-conformance-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonschema = { version = "0.18", default-features = false }
volicord-core = { path = "../../crates/volicord-core" }
volicord-host-contract = { path = "../../crates/volicord-host-contract" }
volicord-mcp-wire = { path = "../../crates/volicord-mcp-wire" }
volicord-platform-fs = { path = "../../crates/volicord-platform-fs" }
volicord-store = { path = "../../crates/volicord-store" }
volicord-test-support = { path = "../../crates/volicord-test-support" }
volicord-types = { path = "../../crates/volicord-types" }
volicord-user-action-service = { path = "../../crates/volicord-user-action-service" }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[test]]
name = "baseline"
path = "baseline.rs"
