[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
pulldown-cmark = "0.12"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
volicord-command-model = { path = "../crates/volicord-command-model" }
volicord-mcp-protocol = { path = "../crates/volicord-mcp-protocol" }
volicord-mcp-wire = { path = "../crates/volicord-mcp-wire" }
volicord-types = { path = "../crates/volicord-types" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
