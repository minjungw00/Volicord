[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
toml_edit = { version = "0.22", features = ["serde"] }
volicord-mcp-protocol = { path = "../crates/volicord-mcp-protocol" }
volicord-test-process = { path = "../crates/volicord-test-process" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
