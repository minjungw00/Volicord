[package]
name = "volicord-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
volicord-core = { path = "../volicord-core" }
volicord-mcp = { path = "../volicord-mcp" }
volicord-platform-fs = { path = "../volicord-platform-fs" }
volicord-platform-process = { path = "../volicord-platform-process" }
volicord-store = { path = "../volicord-store" }
volicord-types = { path = "../volicord-types" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
cap-fs-ext = "3.4.4"
cap-std = "3.4.4"
clap = { version = "4.5.57", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.22"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs", "process", "termios"] }

[dev-dependencies]
volicord-store = { path = "../volicord-store", features = ["test-support"] }
volicord-test-support = { path = "../volicord-test-support" }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "volicord"
path = "src/main.rs"

[[test]]
name = "mcp_test_child"
path = "tests/support/mcp_test_child.rs"
harness = false

[[test]]
name = "operational_host_e2e"
path = "tests/operational_host_e2e.rs"
harness = false
