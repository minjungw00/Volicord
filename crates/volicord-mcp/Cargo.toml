[package]
name = "volicord-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
volicord-core = { path = "../volicord-core" }
volicord-user-action-presentation = { path = "../volicord-user-action-presentation" }
volicord-user-action-service = { path = "../volicord-user-action-service" }
volicord-host-contract = { path = "../volicord-host-contract" }
volicord-mcp-protocol = { path = "../volicord-mcp-protocol" }
volicord-mcp-wire = { path = "../volicord-mcp-wire" }
volicord-platform-fs = { path = "../volicord-platform-fs" }
volicord-store = { path = "../volicord-store" }
volicord-types = { path = "../volicord-types" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
volicord-test-support = { path = "../volicord-test-support" }

[lib]
path = "src/lib.rs"
