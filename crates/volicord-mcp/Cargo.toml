[package]
name = "volicord-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
volicord-core = { path = "../volicord-core" }
volicord-platform-fs = { path = "../volicord-platform-fs" }
volicord-store = { path = "../volicord-store" }
volicord-types = { path = "../volicord-types" }
getrandom = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
volicord-test-support = { path = "../volicord-test-support" }

[lib]
path = "src/lib.rs"
