[package]
name = "volicord-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
volicord-host-contract = { path = "../volicord-host-contract" }
volicord-platform-fs = { path = "../volicord-platform-fs" }
volicord-types = { path = "../volicord-types" }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
test-support = ["volicord-platform-fs/test-support"]

[dev-dependencies]
volicord-platform-fs = { path = "../volicord-platform-fs", features = ["test-support"] }
volicord-test-support = { path = "../volicord-test-support" }

[lib]
path = "src/lib.rs"
