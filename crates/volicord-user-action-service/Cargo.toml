[package]
name = "volicord-user-action-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
volicord-store = { path = "../volicord-store" }
volicord-types = { path = "../volicord-types" }

[dev-dependencies]
volicord-test-support = { path = "../volicord-test-support" }

[lib]
path = "src/lib.rs"
