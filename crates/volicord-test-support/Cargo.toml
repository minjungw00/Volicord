[package]
name = "volicord-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
volicord-host-contract = { path = "../volicord-host-contract" }
volicord-platform-fs = { path = "../volicord-platform-fs" }
volicord-store = { path = "../volicord-store", features = ["test-support"] }
volicord-types = { path = "../volicord-types" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tempfile = "3"

[lib]
path = "src/lib.rs"
