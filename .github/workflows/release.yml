        run: |
          set -eu
          root="$RUNNER_TEMP/volicord-codex-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos-arm64"
          test "$root" != "$RUNNER_TEMP"
          rm -rf -- "$root"

  codex-release-cell-macos-x86-64:
    name: Codex Intel x86-64 native macOS release cell
    if: github.event_name != 'pull_request'
    needs:
      - codex-release-contract
      - build-binaries
    runs-on: [self-hosted, volicord-release, macos, native-macos, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Create fresh external cell roots
        run: |
          set -eu
          root="$RUNNER_TEMP/volicord-codex-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos-x86-64"
          test ! -e "$root"
          mkdir -p "$root/release-evidence-artifact/scenario-evidence" "$root/work"
          {
            echo "VOLICORD_CODEX_RELEASE_EVIDENCE_DIR=$root/release-evidence-artifact/scenario-evidence"
            echo "VOLICORD_CODEX_RELEASE_CANDIDATE_CELL_PATH=$root/release-evidence-artifact/release-evidence.json"
            echo "VOLICORD_CODEX_RELEASE_VOLICORD_PATH=$root/build/volicord"
            echo "VOLICORD_CODEX_RELEASE_WORK_ROOT=$root/work"
            echo "VOLICORD_HOME=$root/work/runtime-home"
          } >> "$GITHUB_ENV"

      - name: Download the immutable Intel macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x86-64/build

      - name: Restore executable mode without changing candidate bytes
        run: chmod 0755 "$VOLICORD_CODEX_RELEASE_VOLICORD_PATH"

      - name: Verify the downloaded binary and build metadata before execution
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-build-artifact
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x86-64/build"
          --source-revision "${{ github.sha }}"
          --target x86_64-apple-darwin

      - name: Validate the downloaded Intel x86-64 binary once and capture evidence
        run: cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate -- --capture-candidate x86_64-apple-darwin --platform macos

      - name: Rehash the binary and verify complete passing cell evidence
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-cell-evidence
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x86-64/build"
          --evidence-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x86-64/release-evidence-artifact"
          --source-revision "${{ github.sha }}"
          --target x86_64-apple-darwin
          --platform macos

