name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/smoke-test-binary.sh"
      - "scripts/smoke-test-binary.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  binary:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add "${{ matrix.target }}"

      - name: Build volicord
        run: cargo build --locked --release -p volicord-cli --bin volicord --target "${{ matrix.target }}"

      - name: Smoke test binary
        if: runner.os != 'Windows'
        run: scripts/smoke-test-binary.sh "target/${{ matrix.target }}/release/volicord"

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-binary.ps1 -Bin "target/${{ matrix.target }}/release/volicord.exe"

      - name: Package artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          package="volicord-$TARGET"
          dist="dist"
          staging="$dist/$package"
          mkdir -p "$staging"
          cp "$binary" "$staging/volicord"
          chmod 0755 "$staging/volicord"
          tar -C "$staging" -czf "$dist/$package.tar.gz" volicord
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dist/$package.tar.gz" > "$dist/$package.tar.gz.sha256"
          else
            shasum -a 256 "$dist/$package.tar.gz" > "$dist/$package.tar.gz.sha256"
          fi
          rm -rf "$staging"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $package = "volicord-$target"
          $dist = "dist"
          $staging = Join-Path $dist $package
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $staging "volicord.exe") -Force
          Compress-Archive -Path (Join-Path $staging "volicord.exe") -DestinationPath "$dist/$package.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$dist/$package.zip").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$dist/$package.zip.sha256" -Value "$hash  $package.zip" -Encoding ascii
          Remove-Item -LiteralPath $staging -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: volicord-${{ matrix.target }}
          path: |
            dist/volicord-${{ matrix.target }}.*
          if-no-files-found: error

  windows-test:
    name: Windows cargo test
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  docker-image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t volicord:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run --rm volicord:${{ github.sha }} --help
          docker run --rm volicord:${{ github.sha }} serve --help

      - name: Smoke test Docker Local HTTP transport
        run: |
          set -eu
          tmp="$(mktemp -d)"
          container=""
          cleanup() {
            if [ -n "$container" ]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT HUP INT TERM

          repo="$tmp/product-repo"
          home="$tmp/runtime-home"
          mkdir -p "$repo/.git" "$home"
          chmod -R 0777 "$tmp"
          docker_user="$(id -u):$(id -g)"

          docker run --rm \
            --user "$docker_user" \
            -v "$repo:/workspace/repo" \
            -v "$home:/var/lib/volicord" \
            --entrypoint /bin/sh \
            volicord:${{ github.sha }} \
            -c 'set -eu
              mkdir -p /tmp/bin
              printf "%s\n" "#!/bin/sh" "if [ \"\$1\" = \"--version\" ]; then printf \"codex 1.2.3-test\\n\"; exit 0; fi" "printf \"unexpected codex invocation\\n\" >&2" "exit 2" > /tmp/bin/codex
              chmod 0755 /tmp/bin/codex
              PATH="/tmp/bin:/usr/local/bin:$PATH" VOLICORD_HOME=/var/lib/volicord volicord init --host codex --repo /workspace/repo --profile record --json >/tmp/init.json'

          token="volicord-docker-smoke-token"
          container="$(docker run -d \
            --user "$docker_user" \
            -p 127.0.0.1:8765:8765 \
            -v "$repo:/workspace/repo" \
            -v "$home:/var/lib/volicord" \
            volicord:${{ github.sha }} \
            serve --transport local-http \
              --container-listen 0.0.0.0:8765 \
              --token "$token" \
              --project /workspace/repo)"

          health_url="http://127.0.0.1:8765/healthz"
          mcp_url="http://127.0.0.1:8765/mcp"
          status_code=""
          attempts=0
          while [ "$attempts" -lt 60 ]; do
            status_code="$(curl -sS -o "$tmp/health.json" -w "%{http_code}" -H "Authorization: Bearer $token" "$health_url" || true)"
            if [ "$status_code" = "200" ]; then
              break
            fi
            attempts=$((attempts + 1))
            sleep 0.5
          done
          if [ "$status_code" != "200" ]; then
            docker logs "$container" || true
            echo "Local HTTP health check returned $status_code" >&2
            exit 1
          fi

          unauth_code="$(curl -sS -o "$tmp/unauth.json" -w "%{http_code}" "$health_url")"
          test "$unauth_code" = "401"
          grep -q "AUTH_REQUIRED" "$tmp/unauth.json"

          init_payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"volicord-docker-smoke","version":"0.0.0"}}}'
          origin_code="$(curl -sS -o "$tmp/origin.json" -w "%{http_code}" \
            -X POST "$mcp_url" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://example.invalid" \
            --data "$init_payload")"
          test "$origin_code" = "403"
          grep -q "ORIGIN_NOT_ALLOWED" "$tmp/origin.json"

          init_code="$(curl -sS -D "$tmp/init.headers" -o "$tmp/init.json" -w "%{http_code}" \
            -X POST "$mcp_url" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            --data "$init_payload")"
          test "$init_code" = "200"
          grep -qi "^Mcp-Session-Id:" "$tmp/init.headers"

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - binary
      - windows-test
      - docker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: volicord-*
          path: dist
          merge-multiple: true

      - name: Add install script and aggregate checksums
        run: |
          set -eu
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          chmod 0644 dist/install.sh dist/install.ps1
          (cd dist && cat *.sha256 > volicord-checksums.txt)

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Volicord $tag"
          fi
          gh release upload "$tag" dist/* --clobber
