        with:
          name: volicord-release-evidence-x86_64-apple-darwin-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-macos-x86-64/release-evidence-artifact
          if-no-files-found: error

      - name: Remove disposable macOS x86-64 cell roots
        if: always()
        run: |
          set -eu
          root="$RUNNER_TEMP/volicord-codex-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-macos-x86-64"
          test "$root" != "$RUNNER_TEMP"
          rm -rf -- "$root"

  codex-release-cell-native-windows:
    name: Codex native Windows release cell
    if: github.event_name != 'pull_request'
    needs:
      - codex-release-contract
      - build-binaries
    runs-on: [self-hosted, volicord-release, windows, native-windows, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Create fresh external cell roots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-native-windows"
          if (Test-Path -LiteralPath $root) {
            throw "fresh release-cell root already exists: $root"
          }
          $evidenceArtifact = Join-Path $root "release-evidence-artifact"
          $evidence = Join-Path $evidenceArtifact "scenario-evidence"
          $work = Join-Path $root "work"
          New-Item -ItemType Directory -Path $evidence, $work | Out-Null
          "VOLICORD_CODEX_RELEASE_EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_CANDIDATE_CELL_PATH=$(Join-Path $evidenceArtifact 'release-evidence.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_VOLICORD_PATH=$(Join-Path $root 'build/volicord.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_WORK_ROOT=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_HOME=$(Join-Path $work 'runtime-home')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the immutable native Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-native-windows/build

      - name: Verify the downloaded binary and build metadata before execution
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-build-artifact
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-native-windows/build"
          --source-revision "${{ github.sha }}"
          --target x86_64-pc-windows-msvc

      - name: Validate the downloaded native Windows binary once and capture evidence
        run: cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate -- --capture-candidate x86_64-pc-windows-msvc --platform native_windows

      - name: Rehash the binary and verify complete passing cell evidence
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-cell-evidence
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-native-windows/build"
          --evidence-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-native-windows/release-evidence-artifact"
          --source-revision "${{ github.sha }}"
          --target x86_64-pc-windows-msvc
          --platform native_windows

      - name: Upload bounded native Windows scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volicord-release-evidence-x86_64-pc-windows-msvc-native_windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-native-windows/release-evidence-artifact
          if-no-files-found: error

      - name: Remove disposable native Windows cell roots
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-native-windows"
          if ($root -eq $env:RUNNER_TEMP) {
            throw "refusing to remove the runner temp root"
          }
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }

  codex-release-cell-wsl2:
    name: Codex WSL2 release cell (native Windows supervisor)
    if: github.event_name != 'pull_request'
    needs:
      - codex-release-contract
      - build-binaries
    runs-on: [self-hosted, volicord-release, windows, wsl2, ubuntu-24.04, x64]
    steps:
      - name: Check out repository on the native Windows supervisor
        uses: actions/checkout@v4

      - name: Select Windows-side Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Create fresh Windows evidence and WSL2 ext4 work roots
        shell: pwsh
        run: |
          $distribution = "Ubuntu-24.04"
          $hostRoot = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-wsl2"
          if (Test-Path -LiteralPath $hostRoot) {
            throw "fresh release-cell root already exists: $hostRoot"
          }
          $evidenceArtifact = Join-Path $hostRoot "release-evidence-artifact"
          $evidence = Join-Path $evidenceArtifact "scenario-evidence"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $wslHome = (& wsl.exe --distribution $distribution --exec printenv HOME | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $wslHome.StartsWith("/")) {
            throw "cannot resolve the WSL2 distribution home"
          }
          $base = "$wslHome/volicord-release-cells/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $work = "$base/work"
          $candidateDirectory = "$base/candidate"
          & wsl.exe --distribution $distribution --exec test '!' -e $base
          if ($LASTEXITCODE -ne 0) {
            throw "fresh WSL2 ext4 cell root already exists: $base"
          }
          & wsl.exe --distribution $distribution --exec mkdir -p $work $candidateDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "cannot create WSL2 ext4 cell roots: $base"
          }
          "VOLICORD_CODEX_RELEASE_EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_CANDIDATE_CELL_PATH=$(Join-Path $evidenceArtifact 'release-evidence.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_VOLICORD_PATH=$candidateDirectory/volicord" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_WORK_ROOT=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_HOME=$work/runtime-home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VOLICORD_CODEX_RELEASE_WSL2_DISTRIBUTION=$distribution" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the same immutable Linux x86-64 build artifact used by native Linux
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-wsl2/build

      - name: Verify the downloaded Linux binary and build metadata before transfer
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-build-artifact
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-wsl2/build"
          --source-revision "${{ github.sha }}"
          --target x86_64-unknown-linux-gnu

      - name: Copy the exact Linux bytes into WSL2 ext4 and verify the digest inside WSL2
        shell: pwsh
        run: |
          $distribution = $env:VOLICORD_CODEX_RELEASE_WSL2_DISTRIBUTION
          $hostCandidate = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-wsl2/build/volicord"
          $metadataPath = Join-Path (Split-Path -Parent $hostCandidate) "build-metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $hostDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $hostCandidate).Hash.ToLowerInvariant()
          if ($hostDigest -ne $metadata.binary_sha256) {
            throw "downloaded Linux binary digest changed before WSL2 transfer"
          }
          $wslSource = (& wsl.exe --distribution $distribution --exec wslpath -u $hostCandidate | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $wslSource.StartsWith("/mnt/")) {
            throw "cannot translate the downloaded candidate path for WSL2 transfer"
          }
          & wsl.exe --distribution $distribution --exec cp -- $wslSource $env:VOLICORD_CODEX_RELEASE_VOLICORD_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "cannot copy the downloaded Linux binary into the WSL2 ext4 candidate path"
          }
          & wsl.exe --distribution $distribution --exec chmod 0755 $env:VOLICORD_CODEX_RELEASE_VOLICORD_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "cannot make the WSL2 candidate executable"
          }
          $wslDigestLine = (& wsl.exe --distribution $distribution --exec sha256sum -- $env:VOLICORD_CODEX_RELEASE_VOLICORD_PATH | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "cannot hash the transferred candidate inside WSL2"
          }
          $wslDigest = ($wslDigestLine -split '\s+')[0]
          if ($wslDigest -ne $metadata.binary_sha256) {
            throw "WSL2 ext4 candidate digest differs from the downloaded Linux binary"
          }

      - name: Validate the transferred Linux x86-64 binary once in WSL2 and capture evidence
        run: cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate -- --capture-candidate x86_64-unknown-linux-gnu --platform wsl2

      - name: Verify the candidate digest inside WSL2 after validation
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-wsl2/build/build-metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $digestLine = (& wsl.exe --distribution $env:VOLICORD_CODEX_RELEASE_WSL2_DISTRIBUTION --exec sha256sum -- $env:VOLICORD_CODEX_RELEASE_VOLICORD_PATH | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "cannot hash the WSL2 candidate after validation"
          }
          $digest = ($digestLine -split '\s+')[0]
          if ($digest -ne $metadata.binary_sha256) {
            throw "WSL2 candidate bytes changed during release validation"
          }

      - name: Verify complete passing WSL2 evidence against the same raw build artifact
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-cell-evidence
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-wsl2/build"
          --evidence-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-wsl2/release-evidence-artifact"
          --source-revision "${{ github.sha }}"
          --target x86_64-unknown-linux-gnu
          --platform wsl2

      - name: Upload bounded WSL2 scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volicord-release-evidence-x86_64-unknown-linux-gnu-wsl2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-wsl2/release-evidence-artifact
          if-no-files-found: error

      - name: Remove disposable Windows and WSL2 cell roots
        if: always()
        shell: pwsh
        run: |
          $distribution = "Ubuntu-24.04"
          $hostRoot = Join-Path $env:RUNNER_TEMP "volicord-codex-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-wsl2"
          if ($hostRoot -eq $env:RUNNER_TEMP) {
            throw "refusing to remove the runner temp root"
          }
          if (Test-Path -LiteralPath $hostRoot) {
            Remove-Item -LiteralPath $hostRoot -Recurse -Force
          }
          $wslHome = (& wsl.exe --distribution $distribution --exec printenv HOME | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $wslHome.StartsWith("/")) {
            throw "cannot resolve the WSL2 distribution home"
          }
          $base = "$wslHome/volicord-release-cells/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & wsl.exe --distribution $distribution --exec rm -rf -- $base
          if ($LASTEXITCODE -ne 0) {
            throw "cannot remove disposable WSL2 cell root: $base"
          }

  build-binaries:
    name: Build raw binary once (${{ matrix.target }})
    needs:
      - version-alignment
      - codex-release-contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        env:
          VOLICORD_REPO: example/volicord
        run: |
          set -eu
          sh -n scripts/install.sh
          target="$(sh scripts/install.sh --print-target)"
          test -n "$target"
          dry_install_dir="$RUNNER_TEMP/volicord-install-dry-run-${{ matrix.target }}-$$"
          dry_output="$RUNNER_TEMP/volicord-install-dry-run.txt"
          sh scripts/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "target: $target" "$dry_output"
          grep -F "release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz" "$dry_output"
          grep -F "install directory: $dry_install_dir" "$dry_output"
          grep -F "binary to install: volicord" "$dry_output"
          grep -F "checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz.sha256; if unavailable, installation would warn and continue" "$dry_output"
          test ! -e "$dry_install_dir"

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VOLICORD_REPO: example/volicord
        run: |
          $scriptPath = (Resolve-Path -LiteralPath "scripts/install.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
              throw ($errors | Out-String)
          }

          $target = (& ./scripts/install.ps1 -PrintTarget).Trim()
          if ($target -ne "x86_64-pc-windows-msvc") {
              throw "unexpected installer target: $target"
          }

          $dryInstallDir = Join-Path $env:RUNNER_TEMP ("volicord-install-dry-run-" + [System.Guid]::NewGuid().ToString("N"))
          $dryOutput = Join-Path $env:RUNNER_TEMP "volicord-install-dry-run.txt"
          & ./scripts/install.ps1 -DryRun -InstallDir $dryInstallDir *> $dryOutput
          $dry = Get-Content -LiteralPath $dryOutput -Raw
          if (-not $dry.Contains("target: $target")) {
              throw "dry-run output did not include target"
          }
          if (-not $dry.Contains("release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.zip")) {
              throw "dry-run output did not include release asset URL"
          }
          if (-not $dry.Contains("install directory: $dryInstallDir")) {
              throw "dry-run output did not include install directory"
          }
          if (-not $dry.Contains("binary to install: volicord.exe")) {
              throw "dry-run output did not include installed binary"
          }
          if (-not $dry.Contains("checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.zip.sha256; if unavailable, installation would warn and continue")) {
              throw "dry-run output did not include checksum plan"
          }
          if (Test-Path -LiteralPath $dryInstallDir) {
              throw "dry-run created install directory: $dryInstallDir"
          }

      - name: Install Rust
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add "${{ matrix.target }}"

      - name: Prepare exact build identity
        if: runner.os != 'Windows'
        run: |
          set -eu
          git_status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [ -n "$git_status" ]; then
            echo "refusing to stamp a clean release build from a dirty checkout:" >&2
            printf '%s\n' "$git_status" >&2
            exit 1
          fi
          git_commit="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$git_commit" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD does not match GITHUB_SHA" >&2
            printf 'checkout HEAD: %s\n' "$git_commit" >&2
            printf 'GITHUB_SHA:   %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Prepare exact build identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitStatus = @(& git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
              throw "git status failed with exit code $LASTEXITCODE"
          }
          if ($gitStatus.Count -ne 0) {
              throw "refusing to stamp a clean release build from a dirty checkout:`n$($gitStatus -join "`n")"
          }
          $gitCommitOutput = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "git rev-parse failed with exit code $LASTEXITCODE"
          }
          $gitCommit = ($gitCommitOutput | Out-String).Trim().ToLowerInvariant()
          if ($gitCommit -ne $env:GITHUB_SHA) {
              throw "checkout HEAD $gitCommit does not match GITHUB_SHA $env:GITHUB_SHA"
          }

      - name: Build volicord
        env:
          VOLICORD_BUILD_GIT_COMMIT: ${{ github.sha }}
          VOLICORD_BUILD_GIT_DIRTY: "false"
          VOLICORD_BUILD_PROFILE: release
        run: cargo build --locked --release -p volicord-cli --bin volicord --target "${{ matrix.target }}"

      - name: Verify exact build identity
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          actual="$("$binary" --version)"
          required=";git=$GITHUB_SHA;tree=clean;metadata_source=environment;target=$TARGET;profile=release;profile_class=release;profile_exact=true;"
          case "$actual" in
            "volicord "*" (build_id="*"$required"*")") ;;
            *)
              echo "release binary build identity mismatch" >&2
              printf 'required identity segment: %s\n' "$required" >&2
              printf 'actual:                    %s\n' "$actual" >&2
              exit 1
              ;;
          esac

      - name: Verify exact build identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $actual = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "release binary --version failed with exit code $LASTEXITCODE"
          }
          $sha = [regex]::Escape($env:GITHUB_SHA)
          $escapedTarget = [regex]::Escape($target)
          $pattern = "^volicord [^ ]+ \(build_id=[^;]+;git=$sha;tree=clean;metadata_source=environment;target=$escapedTarget;profile=release;profile_class=release;profile_exact=true;.*\)$"
          if ($actual -notmatch $pattern) {
              throw "release binary build identity mismatch`nrequired pattern: $pattern`nactual:           $actual"
          }

      - name: Smoke test binary
        if: runner.os != 'Windows'
        run: sh scripts/smoke-test-binary.sh "target/${{ matrix.target }}/release/volicord"

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-binary.ps1 -Bin "target/${{ matrix.target }}/release/volicord.exe"

      - name: Stage immutable raw build artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$binary" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$binary" | awk '{print $1}')"
          fi
          artifact="$RUNNER_TEMP/volicord-build-$TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$artifact"
          mkdir -p "$artifact"
          cp "$binary" "$artifact/volicord"
          chmod 0755 "$artifact/volicord"
          if command -v sha256sum >/dev/null 2>&1; then
            staged_digest="$(sha256sum "$artifact/volicord" | awk '{print $1}')"
          else
            staged_digest="$(shasum -a 256 "$artifact/volicord" | awk '{print $1}')"
          fi
          test "$staged_digest" = "$digest"
          printf '%s  volicord\n' "$digest" > "$artifact/volicord.sha256"
          printf '{"contract_id":"volicord.release-build-artifact","target_triple":"%s","source_revision":"%s","binary_name":"volicord","binary_sha256":"%s"}\n' \
            "$TARGET" "$GITHUB_SHA" "$digest" > "$artifact/build-metadata.json"

      - name: Stage immutable raw build artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          $artifact = Join-Path $env:RUNNER_TEMP "volicord-build-$target-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $artifact) {
            throw "raw build artifact path already exists: $artifact"
          }
          New-Item -ItemType Directory -Path $artifact | Out-Null
          $candidate = Join-Path $artifact "volicord.exe"
          Copy-Item -LiteralPath $binary -Destination $candidate
          $stagedDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($stagedDigest -ne $digest) {
            throw "staged raw binary digest differs from the built binary"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $artifact "volicord.sha256"),
            "$digest  volicord.exe`n",
            [System.Text.Encoding]::ASCII
          )
          $metadata = [ordered]@{
            contract_id = "volicord.release-build-artifact"
            target_triple = $target
            source_revision = $env:GITHUB_SHA
            binary_name = "volicord.exe"
            binary_sha256 = $digest
          }
          $metadata | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifact "build-metadata.json") -Encoding ascii

      - name: Upload immutable raw binary and digest metadata
        uses: actions/upload-artifact@v4
        with:
          name: volicord-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0

  windows-test:
    name: Windows cargo test
    needs: version-alignment
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  docker-image:
    name: Docker image from the raw Linux x86-64 build
    needs:
      - version-alignment
      - build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Download the immutable Linux x86-64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-docker-build-input

      - name: Verify the raw binary before container packaging
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-build-artifact
          --build-artifact-dir "${{ runner.temp }}/volicord-docker-build-input"
          --source-revision "${{ github.sha }}"
          --target x86_64-unknown-linux-gnu

      - name: Package the same raw binary into the image
        run: |
          set -eu
          context="$RUNNER_TEMP/volicord-docker-context"
          test ! -e "$context"
          mkdir -p "$context"
          cp "$RUNNER_TEMP/volicord-docker-build-input/volicord" "$context/volicord"
          cp Dockerfile.release "$context/Dockerfile"
          docker build -t "volicord:${{ github.sha }}" "$context"

      - name: Verify exact binary bytes and build identity inside the image
        run: |
          set -eu
          expected="$(awk '{print $1}' "$RUNNER_TEMP/volicord-docker-build-input/volicord.sha256")"
          actual_digest="$(docker run --rm --entrypoint sha256sum "volicord:${{ github.sha }}" /usr/local/bin/volicord | awk '{print $1}')"
          test "$actual_digest" = "$expected"
          target="x86_64-unknown-linux-gnu"
          actual="$(docker run --rm "volicord:${{ github.sha }}" --version)"
          required=";git=$GITHUB_SHA;tree=clean;metadata_source=environment;target=$target;profile=release;profile_class=release;profile_exact=true;"
          case "$actual" in
            "volicord "*" (build_id="*"$required"*")") ;;
            *)
              echo "container build identity mismatch" >&2
              printf 'required identity segment: %s\n' "$required" >&2
              printf 'actual:                    %s\n' "$actual" >&2
              exit 1
              ;;
          esac

      - name: Smoke test image
        run: docker run --rm "volicord:${{ github.sha }}" --help

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-binaries
      - codex-release-cell-linux-x86-64
      - codex-release-cell-linux-arm64
      - codex-release-cell-macos-arm64
      - codex-release-cell-macos-x86-64
      - codex-release-cell-native-windows
      - codex-release-cell-wsl2
      - windows-test
      - docker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust for the publication integrity gate
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Download the same immutable raw build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: volicord-build-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-release-inputs/builds

      - name: Download all six exact release-cell evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: volicord-release-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-release-inputs/evidence

      - name: Verify all build digests and complete passing release evidence
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-publish-evidence
          --build-root "${{ runner.temp }}/volicord-release-inputs/builds"
          --evidence-root "${{ runner.temp }}/volicord-release-inputs/evidence"
          --source-revision "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --verified-index-output "${{ runner.temp }}/volicord-release-inputs/verified-release-index.json"

      - name: Package the verified raw binaries and verify archive contents
        run: >-
          sh scripts/package-release-artifacts.sh
          "${{ runner.temp }}/volicord-release-inputs/builds"
          dist
          "${{ github.run_id }}"
          "${{ github.run_attempt }}"

      - name: Stage the verified external release index
        run: cp "${{ runner.temp }}/volicord-release-inputs/verified-release-index.json" dist/verified-release-index.json

      - name: Add stamped install scripts and aggregate checksums
        run: |
          set -eu
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          awk -v url="$release_base_url" -v q="'" '
            /^STAMPED_RELEASE_BASE_URL=/ {
              print "STAMPED_RELEASE_BASE_URL=" q url q
              next
            }
            { print }
          ' dist/install.sh > dist/install.sh.stamped
          mv dist/install.sh.stamped dist/install.sh
          awk -v url="$release_base_url" '
            /^\$StampedReleaseBaseUrl = / {
              print "$StampedReleaseBaseUrl = \"" url "\""
              next
            }
            { print }
          ' dist/install.ps1 > dist/install.ps1.stamped
          mv dist/install.ps1.stamped dist/install.ps1
          chmod 0644 dist/install.sh dist/install.ps1
          sh -n dist/install.sh
          target="$(sh dist/install.sh --print-target)"
          dry_install_dir="$RUNNER_TEMP/volicord-stamped-install-dry-run-$$"
          dry_output="$RUNNER_TEMP/volicord-stamped-install-dry-run.txt"
          env -u VOLICORD_RELEASE_BASE_URL -u VOLICORD_REPO -u VOLICORD_VERSION sh dist/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "release asset URL: $release_base_url/volicord-$target.tar.gz" "$dry_output"
          grep -F "$release_base_url" dist/install.ps1
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("dist/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -ne 0) { throw ($errors | Out-String) }'
          fi
          test ! -e "$dry_install_dir"
          (cd dist && cat *.sha256 > volicord-checksums.txt)

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Volicord $tag"
          fi
          gh release upload "$tag" dist/*
