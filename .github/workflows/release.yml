name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/smoke-test-binary.sh"
      - "scripts/smoke-test-binary.ps1"
      - "scripts/package-release-artifacts.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "Dockerfile.release"
      - "crates/**"
      - "tests/release-validation/**"
      - "tests/**/Cargo.toml"
      - "xtask/**"

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"
  VOLICORD_CODEX_RELEASE_SOURCE_REVISION: ${{ github.sha }}

jobs:
  version-alignment:
    name: Release version alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Verify workspace and release tag version alignment
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cargo run --locked -p xtask -- release-version-check --tag "$GITHUB_REF_NAME"
          else
            cargo run --locked -p xtask -- release-version-check
          fi

  codex-release-contract:
    name: Codex release contract (does not execute platform cells)
    needs: version-alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Validate checked-in manifest and static platform contracts
        run: cargo test --locked -p volicord-release-validation-tests --all-targets --all-features

  codex-release-cell-linux-x86-64:
    name: Codex x86-64 native Linux release cell
    if: github.event_name != 'pull_request'
    needs:
      - codex-release-contract
      - build-binaries
    runs-on: [self-hosted, volicord-release, linux, native-linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Create fresh external cell roots
        run: |
          set -eu
          root="$RUNNER_TEMP/volicord-codex-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-linux-x86-64"
          test ! -e "$root"
          mkdir -p "$root/release-evidence-artifact/scenario-evidence" "$root/work"
          {
            echo "VOLICORD_CODEX_RELEASE_EVIDENCE_DIR=$root/release-evidence-artifact/scenario-evidence"
            echo "VOLICORD_CODEX_RELEASE_CANDIDATE_CELL_PATH=$root/release-evidence-artifact/release-evidence.json"
            echo "VOLICORD_CODEX_RELEASE_VOLICORD_PATH=$root/build/volicord"
            echo "VOLICORD_CODEX_RELEASE_WORK_ROOT=$root/work"
            echo "VOLICORD_HOME=$root/work/runtime-home"
          } >> "$GITHUB_ENV"

      - name: Download the immutable Linux x86-64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x86-64/build

      - name: Restore executable mode without changing candidate bytes
        run: chmod 0755 "$VOLICORD_CODEX_RELEASE_VOLICORD_PATH"

      - name: Verify the downloaded binary and build metadata before execution
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-build-artifact
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x86-64/build"
          --source-revision "${{ github.sha }}"
          --target x86_64-unknown-linux-gnu

      - name: Validate the downloaded x86-64 native Linux binary once and capture evidence
        run: cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate -- --capture-candidate x86_64-unknown-linux-gnu --platform linux

      - name: Rehash the binary and verify complete passing cell evidence
        run: >-
          cargo run --locked -p volicord-release-validation-tests --bin codex-release-cell-gate --
          --verify-cell-evidence
          --build-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x86-64/build"
          --evidence-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x86-64/release-evidence-artifact"
          --source-revision "${{ github.sha }}"
          --target x86_64-unknown-linux-gnu
          --platform linux

      - name: Upload bounded Linux scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volicord-release-evidence-x86_64-unknown-linux-gnu-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-x86-64/release-evidence-artifact
          if-no-files-found: error

      - name: Remove disposable Linux cell roots
        if: always()
        run: |
          set -eu
          root="$RUNNER_TEMP/volicord-codex-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-linux-x86-64"
          test "$root" != "$RUNNER_TEMP"
          rm -rf -- "$root"

  codex-release-cell-linux-arm64:
    name: Codex AArch64 native Linux release cell
