name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/smoke-test-binary.sh"
      - "scripts/smoke-test-binary.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "tests/**/Cargo.toml"
      - "xtask/**"

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  version-alignment:
    name: Release version alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Verify workspace and release tag version alignment
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cargo run --locked -p xtask -- release-version-check --tag "$GITHUB_REF_NAME"
          else
            cargo run --locked -p xtask -- release-version-check
          fi

  binary:
    name: Binary (${{ matrix.target }})
    needs: version-alignment
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        env:
          VOLICORD_REPO: example/volicord
        run: |
          set -eu
          sh -n scripts/install.sh
          target="$(sh scripts/install.sh --print-target)"
          test -n "$target"
          dry_install_dir="$RUNNER_TEMP/volicord-install-dry-run-${{ matrix.target }}-$$"
          dry_output="$RUNNER_TEMP/volicord-install-dry-run.txt"
          sh scripts/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "target: $target" "$dry_output"
          grep -F "release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz" "$dry_output"
          grep -F "install directory: $dry_install_dir" "$dry_output"
          grep -F "binary to install: volicord" "$dry_output"
          grep -F "checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz.sha256; if unavailable, installation would warn and continue" "$dry_output"
          test ! -e "$dry_install_dir"

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VOLICORD_REPO: example/volicord
        run: |
          $scriptPath = (Resolve-Path -LiteralPath "scripts/install.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
              throw ($errors | Out-String)
          }

          $target = (& ./scripts/install.ps1 -PrintTarget).Trim()
          if ($target -ne "x86_64-pc-windows-msvc") {
              throw "unexpected installer target: $target"
          }

          $dryInstallDir = Join-Path $env:RUNNER_TEMP ("volicord-install-dry-run-" + [System.Guid]::NewGuid().ToString("N"))
          $dryOutput = Join-Path $env:RUNNER_TEMP "volicord-install-dry-run.txt"
          & ./scripts/install.ps1 -DryRun -InstallDir $dryInstallDir *> $dryOutput
          $dry = Get-Content -LiteralPath $dryOutput -Raw
          if (-not $dry.Contains("target: $target")) {
              throw "dry-run output did not include target"
          }
          if (-not $dry.Contains("release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.zip")) {
              throw "dry-run output did not include release asset URL"
          }
          if (-not $dry.Contains("install directory: $dryInstallDir")) {
              throw "dry-run output did not include install directory"
          }
          if (-not $dry.Contains("binary to install: volicord.exe")) {
              throw "dry-run output did not include installed binary"
          }
          if (-not $dry.Contains("checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.zip.sha256; if unavailable, installation would warn and continue")) {
              throw "dry-run output did not include checksum plan"
          }
          if (Test-Path -LiteralPath $dryInstallDir) {
              throw "dry-run created install directory: $dryInstallDir"
          }

      - name: Install Rust
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add "${{ matrix.target }}"

      - name: Prepare exact build identity
        if: runner.os != 'Windows'
        run: |
          set -eu
          git_status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [ -n "$git_status" ]; then
            echo "refusing to stamp a clean release build from a dirty checkout:" >&2
            printf '%s\n' "$git_status" >&2
            exit 1
          fi
          git_commit="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$git_commit" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD does not match GITHUB_SHA" >&2
            printf 'checkout HEAD: %s\n' "$git_commit" >&2
            printf 'GITHUB_SHA:   %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Prepare exact build identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitStatus = @(& git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
              throw "git status failed with exit code $LASTEXITCODE"
          }
          if ($gitStatus.Count -ne 0) {
              throw "refusing to stamp a clean release build from a dirty checkout:`n$($gitStatus -join "`n")"
          }
          $gitCommitOutput = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "git rev-parse failed with exit code $LASTEXITCODE"
          }
          $gitCommit = ($gitCommitOutput | Out-String).Trim().ToLowerInvariant()
          if ($gitCommit -ne $env:GITHUB_SHA) {
              throw "checkout HEAD $gitCommit does not match GITHUB_SHA $env:GITHUB_SHA"
          }

      - name: Build volicord
        env:
          VOLICORD_BUILD_GIT_COMMIT: ${{ github.sha }}
          VOLICORD_BUILD_GIT_DIRTY: "false"
          VOLICORD_BUILD_PROFILE: release
        run: cargo build --locked --release -p volicord-cli --bin volicord --target "${{ matrix.target }}"

      - name: Verify exact build identity
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          actual="$("$binary" --version)"
          required=";git=$GITHUB_SHA;tree=clean;metadata_source=environment;target=$TARGET;profile=release;profile_class=release;profile_exact=true;"
          case "$actual" in
            "volicord "*" (build_id="*"$required"*")") ;;
            *)
              echo "release binary build identity mismatch" >&2
              printf 'required identity segment: %s\n' "$required" >&2
              printf 'actual:                    %s\n' "$actual" >&2
              exit 1
              ;;
          esac

      - name: Verify exact build identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $actual = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "release binary --version failed with exit code $LASTEXITCODE"
          }
          $sha = [regex]::Escape($env:GITHUB_SHA)
          $escapedTarget = [regex]::Escape($target)
          $pattern = "^volicord [^ ]+ \(build_id=[^;]+;git=$sha;tree=clean;metadata_source=environment;target=$escapedTarget;profile=release;profile_class=release;profile_exact=true;.*\)$"
          if ($actual -notmatch $pattern) {
              throw "release binary build identity mismatch`nrequired pattern: $pattern`nactual:           $actual"
          }

      - name: Smoke test binary
        if: runner.os != 'Windows'
        run: sh scripts/smoke-test-binary.sh "target/${{ matrix.target }}/release/volicord"

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-binary.ps1 -Bin "target/${{ matrix.target }}/release/volicord.exe"

      - name: Package artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          package="volicord-$TARGET"
          dist="dist"
          staging="$dist/$package"
          mkdir -p "$staging"
          cp "$binary" "$staging/volicord"
          chmod 0755 "$staging/volicord"
          tar -C "$staging" -czf "$dist/$package.tar.gz" volicord
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dist/$package.tar.gz" > "$dist/$package.tar.gz.sha256"
          else
            shasum -a 256 "$dist/$package.tar.gz" > "$dist/$package.tar.gz.sha256"
          fi
          rm -rf "$staging"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $package = "volicord-$target"
          $dist = "dist"
          $staging = Join-Path $dist $package
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $staging "volicord.exe") -Force
          Compress-Archive -Path (Join-Path $staging "volicord.exe") -DestinationPath "$dist/$package.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$dist/$package.zip").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$dist/$package.zip.sha256" -Value "$hash  $package.zip" -Encoding ascii
          Remove-Item -LiteralPath $staging -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: volicord-${{ matrix.target }}
          path: |
            dist/volicord-${{ matrix.target }}.*
          if-no-files-found: error

  windows-test:
    name: Windows cargo test
    needs: version-alignment
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  docker-image:
    name: Docker image
    needs: version-alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare exact container build identity
        run: |
          set -eu
          git_status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [ -n "$git_status" ]; then
            echo "refusing to stamp a clean container build from a dirty checkout:" >&2
            printf '%s\n' "$git_status" >&2
            exit 1
          fi
          git_commit="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$git_commit" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD does not match GITHUB_SHA" >&2
            printf 'checkout HEAD: %s\n' "$git_commit" >&2
            printf 'GITHUB_SHA:   %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Build image
        run: |
          docker build \
            --build-arg "VOLICORD_BUILD_GIT_COMMIT=${{ github.sha }}" \
            --build-arg "VOLICORD_BUILD_GIT_DIRTY=false" \
            -t volicord:${{ github.sha }} \
            .

      - name: Verify exact container build identity
        run: |
          set -eu
          target="x86_64-unknown-linux-gnu"
          actual="$(docker run --rm volicord:${{ github.sha }} --version)"
          required=";git=$GITHUB_SHA;tree=clean;metadata_source=environment;target=$target;profile=release;profile_class=release;profile_exact=true;"
          case "$actual" in
            "volicord "*" (build_id="*"$required"*")") ;;
            *)
              echo "container build identity mismatch" >&2
              printf 'required identity segment: %s\n' "$required" >&2
              printf 'actual:                    %s\n' "$actual" >&2
              exit 1
              ;;
          esac

      - name: Smoke test image
        run: |
          docker run --rm volicord:${{ github.sha }} --help
          docker run --rm volicord:${{ github.sha }} serve --help

      - name: Smoke test Docker Local HTTP transport
        run: |
          set -eu
          tmp="$(mktemp -d)"
          container=""
          cleanup() {
            if [ -n "$container" ]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT HUP INT TERM

          repo="$tmp/product-repo"
          home="$tmp/runtime-home"
          mkdir -p "$repo/.git" "$home"
          chmod -R 0777 "$tmp"
          docker_user="$(id -u):$(id -g)"

          docker run --rm \
            --user "$docker_user" \
            -v "$repo:/workspace/repo" \
            -v "$home:/var/lib/volicord" \
            --entrypoint /bin/sh \
            volicord:${{ github.sha }} \
            -c 'set -eu
              mkdir -p /tmp/bin
              printf "%s\n" "#!/bin/sh" "if [ \"\$1\" = \"--version\" ]; then printf \"codex 1.2.3-test\\n\"; exit 0; fi" "printf \"unexpected codex invocation\\n\" >&2" "exit 2" > /tmp/bin/codex
              chmod 0755 /tmp/bin/codex
              PATH="/tmp/bin:/usr/local/bin:$PATH" VOLICORD_HOME=/var/lib/volicord volicord init --host codex --repo /workspace/repo --shared --profile record --json >/tmp/init.json'

          token="volicord-docker-smoke-token"
          printf "%s\n" "$token" > "$tmp/serve.token"
          container="$(docker run -d \
            --user "$docker_user" \
            -p 127.0.0.1:8765:8765 \
            -v "$tmp/serve.token:/tmp/volicord-serve.token:ro" \
            -v "$repo:/workspace/repo" \
            -v "$home:/var/lib/volicord" \
            volicord:${{ github.sha }} \
            serve --transport local-http \
              --container-listen 0.0.0.0:8765 \
              --token-file /tmp/volicord-serve.token \
              --project /workspace/repo)"

          health_url="http://127.0.0.1:8765/healthz"
          mcp_url="http://127.0.0.1:8765/mcp"
          status_code=""
          attempts=0
          while [ "$attempts" -lt 60 ]; do
            status_code="$(curl -sS -o "$tmp/health.json" -w "%{http_code}" -H "Authorization: Bearer $token" "$health_url" || true)"
            if [ "$status_code" = "200" ]; then
              break
            fi
            attempts=$((attempts + 1))
            sleep 0.5
          done
          if [ "$status_code" != "200" ]; then
            docker logs "$container" || true
            echo "Local HTTP health check returned $status_code" >&2
            exit 1
          fi

          unauth_code="$(curl -sS -o "$tmp/unauth.json" -w "%{http_code}" "$health_url")"
          test "$unauth_code" = "401"
          grep -q "AUTH_REQUIRED" "$tmp/unauth.json"

          init_payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"volicord-docker-smoke","version":"0.0.0"}}}'
          origin_code="$(curl -sS -o "$tmp/origin.json" -w "%{http_code}" \
            -X POST "$mcp_url" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://example.invalid" \
            --data "$init_payload")"
          test "$origin_code" = "403"
          grep -q "ORIGIN_NOT_ALLOWED" "$tmp/origin.json"

          init_code="$(curl -sS -D "$tmp/init.headers" -o "$tmp/init.json" -w "%{http_code}" \
            -X POST "$mcp_url" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            --data "$init_payload")"
          test "$init_code" = "200"
          grep -qi "^Mcp-Session-Id:" "$tmp/init.headers"

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - binary
      - windows-test
      - docker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: volicord-*
          path: dist
          merge-multiple: true

      - name: Add stamped install scripts and aggregate checksums
        run: |
          set -eu
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          awk -v url="$release_base_url" -v q="'" '
            /^STAMPED_RELEASE_BASE_URL=/ {
              print "STAMPED_RELEASE_BASE_URL=" q url q
              next
            }
            { print }
          ' dist/install.sh > dist/install.sh.stamped
          mv dist/install.sh.stamped dist/install.sh
          awk -v url="$release_base_url" '
            /^\$StampedReleaseBaseUrl = / {
              print "$StampedReleaseBaseUrl = \"" url "\""
              next
            }
            { print }
          ' dist/install.ps1 > dist/install.ps1.stamped
          mv dist/install.ps1.stamped dist/install.ps1
          chmod 0644 dist/install.sh dist/install.ps1
          sh -n dist/install.sh
          target="$(sh dist/install.sh --print-target)"
          dry_install_dir="$RUNNER_TEMP/volicord-stamped-install-dry-run-$$"
          dry_output="$RUNNER_TEMP/volicord-stamped-install-dry-run.txt"
          env -u VOLICORD_RELEASE_BASE_URL -u VOLICORD_REPO -u VOLICORD_VERSION sh dist/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "release asset URL: $release_base_url/volicord-$target.tar.gz" "$dry_output"
          grep -F "$release_base_url" dist/install.ps1
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("dist/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -ne 0) { throw ($errors | Out-String) }'
          fi
          test ! -e "$dry_install_dir"
          (cd dist && cat *.sha256 > volicord-checksums.txt)

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Volicord $tag"
          fi
          gh release upload "$tag" dist/* --clobber
