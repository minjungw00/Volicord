          --evidence-artifact-dir "${{ runner.temp }}/volicord-codex-release-${{ github.run_id }}-${{ github.run_attempt }}-linux-arm64/release-evidence-artifact"
          --source-revision "${{ github.sha }}"
          --target aarch64-unknown-linux-gnu
          --platform linux

      - name: Upload bounded Linux AArch64 scenario evidence
