name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/volicord-release-smoke/**"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/package-release-artifacts.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "Dockerfile.release"
      - "crates/**"
      - "crates/volicord-cli/**"
      - "crates/volicord-mcp-protocol/**"
      - "crates/volicord-test-process/**"
      - "crates/volicord-types/**"
      - "tests/release-integrity/**"
      - "tests/release-smoke/**"
      - "tests/**/Cargo.toml"
      - "xtask/**"

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  version-alignment:
    name: Release version alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Verify workspace and release tag version alignment
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cargo run --locked -p xtask -- release-version-check --tag "$GITHUB_REF_NAME"
          else
            cargo run --locked -p xtask -- release-version-check
          fi

  build-binaries:
    name: Build raw binary once (${{ matrix.target }})
    needs: version-alignment
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: volicord
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: volicord
          - target: aarch64-apple-darwin
            os: macos-15
            binary: volicord
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: volicord
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            binary: volicord.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        env:
          VOLICORD_REPO: example/volicord
        run: |
          set -eu
          sh -n scripts/install.sh
          target="$(sh scripts/install.sh --print-target)"
          test -n "$target"
          dry_install_dir="$RUNNER_TEMP/volicord-install-dry-run-${{ matrix.target }}-$$"
          dry_output="$RUNNER_TEMP/volicord-install-dry-run.txt"
          sh scripts/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "target: $target" "$dry_output"
          grep -F "release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz" "$dry_output"
          grep -F "install directory: $dry_install_dir" "$dry_output"
          grep -F "binary to install: volicord" "$dry_output"
          grep -F "checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.tar.gz.sha256; if unavailable, installation would warn and continue" "$dry_output"
          test ! -e "$dry_install_dir"

      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VOLICORD_REPO: example/volicord
        run: |
          $scriptPath = (Resolve-Path -LiteralPath "scripts/install.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
              throw ($errors | Out-String)
          }

          $target = (& ./scripts/install.ps1 -PrintTarget).Trim()
          if ($target -ne "x86_64-pc-windows-msvc") {
              throw "unexpected installer target: $target"
          }

          $dryInstallDir = Join-Path $env:RUNNER_TEMP ("volicord-install-dry-run-" + [System.Guid]::NewGuid().ToString("N"))
          $dryOutput = Join-Path $env:RUNNER_TEMP "volicord-install-dry-run.txt"
          & ./scripts/install.ps1 -DryRun -InstallDir $dryInstallDir *> $dryOutput
          $dry = Get-Content -LiteralPath $dryOutput -Raw
          if (-not $dry.Contains("target: $target")) {
              throw "dry-run output did not include target"
          }
          if (-not $dry.Contains("release asset URL: https://github.com/example/volicord/releases/latest/download/volicord-$target.zip")) {
              throw "dry-run output did not include release asset URL"
          }
          if (-not $dry.Contains("install directory: $dryInstallDir")) {
              throw "dry-run output did not include install directory"
          }
          if (-not $dry.Contains("binary to install: volicord.exe")) {
              throw "dry-run output did not include installed binary"
          }
          if (-not $dry.Contains("checksum verification: would try https://github.com/example/volicord/releases/latest/download/volicord-$target.zip.sha256; if unavailable, installation would warn and continue")) {
              throw "dry-run output did not include checksum plan"
          }
          if (Test-Path -LiteralPath $dryInstallDir) {
              throw "dry-run created install directory: $dryInstallDir"
          }

      - name: Install Rust
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add "${{ matrix.target }}"

      - name: Prepare exact build identity
        if: runner.os != 'Windows'
        run: |
          set -eu
          git_status="$(git status --porcelain=v1 --untracked-files=normal)"
          if [ -n "$git_status" ]; then
            echo "refusing to stamp a clean release build from a dirty checkout:" >&2
            printf '%s\n' "$git_status" >&2
            exit 1
          fi
          git_commit="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$git_commit" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD does not match GITHUB_SHA" >&2
            printf 'checkout HEAD: %s\n' "$git_commit" >&2
            printf 'GITHUB_SHA:   %s\n' "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Prepare exact build identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitStatus = @(& git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
              throw "git status failed with exit code $LASTEXITCODE"
          }
          if ($gitStatus.Count -ne 0) {
              throw "refusing to stamp a clean release build from a dirty checkout:`n$($gitStatus -join "`n")"
          }
          $gitCommitOutput = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "git rev-parse failed with exit code $LASTEXITCODE"
          }
          $gitCommit = ($gitCommitOutput | Out-String).Trim().ToLowerInvariant()
          if ($gitCommit -ne $env:GITHUB_SHA) {
              throw "checkout HEAD $gitCommit does not match GITHUB_SHA $env:GITHUB_SHA"
          }

      - name: Build volicord
        env:
          VOLICORD_BUILD_GIT_COMMIT: ${{ github.sha }}
          VOLICORD_BUILD_GIT_DIRTY: "false"
          VOLICORD_BUILD_PROFILE: release
        run: cargo build --locked --release -p volicord-cli --bin volicord --target "${{ matrix.target }}"

      - name: Verify product version and build provenance
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          product_version="$("$binary" --version)"
          case "$product_version" in
            "volicord "*) ;;
            *) echo "release binary product version mismatch: $product_version" >&2; exit 1 ;;
          esac
          report="$("$binary" version --json)"
          printf '%s\n' "$report" | jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg target "$TARGET" \
            '.product_name == "Volicord"
             and .package_version == .build.package_version
             and .build.git_commit == $sha
             and .build.git_dirty == false
             and .build.metadata_source == "environment"
             and .build.target_triple == $target
             and .build.build_profile == "release"
             and .build.profile_class == "release"
             and .build.profile_precision == "exact"
             and ((.build.build_id | type) == "string")
             and ((.build.build_id | length) > 0)' >/dev/null

      - name: Verify product version and build provenance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $productVersion = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "release binary --version failed with exit code $LASTEXITCODE"
          }
          if ($productVersion -notmatch '^volicord [^ ]+$') {
              throw "release binary product version mismatch: $productVersion"
          }
          $report = (& $binary version --json | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
              throw "release binary version --json failed with exit code $LASTEXITCODE"
          }
          if ($report.product_name -ne "Volicord" `
              -or $report.package_version -ne $report.build.package_version `
              -or $report.build.git_commit -ne $env:GITHUB_SHA `
              -or $report.build.git_dirty -ne $false `
              -or $report.build.metadata_source -ne "environment" `
              -or $report.build.target_triple -ne $target `
              -or $report.build.build_profile -ne "release" `
              -or $report.build.profile_class -ne "release" `
              -or $report.build.profile_precision -ne "exact" `
              -or [string]::IsNullOrWhiteSpace($report.build.build_id)) {
              throw "release binary build provenance mismatch"
          }

      - name: Smoke test binary
        uses: ./.github/actions/volicord-release-smoke
        with:
          binary-path: target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Stage immutable raw build artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/$TARGET/release/volicord"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$binary" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$binary" | awk '{print $1}')"
          fi
          artifact="$RUNNER_TEMP/volicord-build-$TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$artifact"
          mkdir -p "$artifact"
          cp "$binary" "$artifact/volicord"
          chmod 0755 "$artifact/volicord"
          if command -v sha256sum >/dev/null 2>&1; then
            staged_digest="$(sha256sum "$artifact/volicord" | awk '{print $1}')"
          else
            staged_digest="$(shasum -a 256 "$artifact/volicord" | awk '{print $1}')"
          fi
          test "$staged_digest" = "$digest"
          printf '%s  volicord\n' "$digest" > "$artifact/volicord.sha256"
          printf '{"contract_id":"volicord.release-build-artifact","target_triple":"%s","source_revision":"%s","binary_name":"volicord","binary_sha256":"%s"}\n' \
            "$TARGET" "$GITHUB_SHA" "$digest" > "$artifact/build-metadata.json"

      - name: Stage immutable raw build artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binary = "target/$target/release/volicord.exe"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          $artifact = Join-Path $env:RUNNER_TEMP "volicord-build-$target-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $artifact) {
            throw "raw build artifact path already exists: $artifact"
          }
          New-Item -ItemType Directory -Path $artifact | Out-Null
          $candidate = Join-Path $artifact "volicord.exe"
          Copy-Item -LiteralPath $binary -Destination $candidate
          $stagedDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($stagedDigest -ne $digest) {
            throw "staged raw binary digest differs from the built binary"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $artifact "volicord.sha256"),
            "$digest  volicord.exe`n",
            [System.Text.Encoding]::ASCII
          )
          $metadata = [ordered]@{
            contract_id = "volicord.release-build-artifact"
            target_triple = $target
            source_revision = $env:GITHUB_SHA
            binary_name = "volicord.exe"
            binary_sha256 = $digest
          }
          $metadata | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifact "build-metadata.json") -Encoding ascii

      - name: Upload immutable raw binary and digest metadata
        uses: actions/upload-artifact@v4
        with:
          name: volicord-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0

  windows-test:
    name: Windows cargo test
    needs: version-alignment
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  docker-image:
    name: Docker image from the raw Linux x86-64 build
    needs:
      - version-alignment
      - build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the immutable Linux x86-64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: volicord-build-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-docker-build-input

      - name: Verify the raw binary before container packaging
        run: |
          set -eu
          artifact="${{ runner.temp }}/volicord-docker-build-input"
          expected="$(awk 'NR == 1 { print $1 }' "$artifact/volicord.sha256")"
          actual="$(sha256sum "$artifact/volicord" | awk '{print $1}')"
          test "${#expected}" -eq 64
          test "$actual" = "$expected"

      - name: Package the same raw binary into the image
        run: |
          set -eu
          context="$RUNNER_TEMP/volicord-docker-context"
          test ! -e "$context"
          mkdir -p "$context"
          cp "$RUNNER_TEMP/volicord-docker-build-input/volicord" "$context/volicord"
          cp Dockerfile.release "$context/Dockerfile"
          docker build -t "volicord:${{ github.sha }}" "$context"

      - name: Verify exact binary bytes and build provenance inside the image
        run: |
          set -eu
          expected="$(awk '{print $1}' "$RUNNER_TEMP/volicord-docker-build-input/volicord.sha256")"
          actual_digest="$(docker run --rm --entrypoint sha256sum "volicord:${{ github.sha }}" /usr/local/bin/volicord | awk '{print $1}')"
          test "$actual_digest" = "$expected"
          target="x86_64-unknown-linux-gnu"
          product_version="$(docker run --rm "volicord:${{ github.sha }}" --version)"
          case "$product_version" in
            "volicord "*) ;;
            *) echo "container product version mismatch: $product_version" >&2; exit 1 ;;
          esac
          report="$(docker run --rm "volicord:${{ github.sha }}" version --json)"
          printf '%s\n' "$report" | jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg target "$target" \
            '.product_name == "Volicord"
             and .package_version == .build.package_version
             and .build.git_commit == $sha
             and .build.git_dirty == false
             and .build.metadata_source == "environment"
             and .build.target_triple == $target
             and .build.build_profile == "release"
             and .build.profile_class == "release"
             and .build.profile_precision == "exact"
             and ((.build.build_id | type) == "string")
             and ((.build.build_id | length) > 0)' >/dev/null

      - name: Smoke test image
        run: docker run --rm "volicord:${{ github.sha }}" --help

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-binaries
      - windows-test
      - docker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the same immutable raw build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: volicord-build-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volicord-release-inputs/builds

      - name: Package the raw binaries and verify archive contents
        run: >-
          sh scripts/package-release-artifacts.sh
          "${{ runner.temp }}/volicord-release-inputs/builds"
          dist
          "${{ github.run_id }}"
          "${{ github.run_attempt }}"

      - name: Install Rust for source packaging
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Build and validate the committed source bundle
        run: cargo run --locked -p xtask -- source-bundle --output dist/volicord-source.zip

      - name: Add stamped install scripts and aggregate checksums
        run: |
          set -eu
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          awk -v url="$release_base_url" -v q="'" '
            /^STAMPED_RELEASE_BASE_URL=/ {
              print "STAMPED_RELEASE_BASE_URL=" q url q
              next
            }
            { print }
          ' dist/install.sh > dist/install.sh.stamped
          mv dist/install.sh.stamped dist/install.sh
          awk -v url="$release_base_url" '
            /^\$StampedReleaseBaseUrl = / {
              print "$StampedReleaseBaseUrl = \"" url "\""
              next
            }
            { print }
          ' dist/install.ps1 > dist/install.ps1.stamped
          mv dist/install.ps1.stamped dist/install.ps1
          chmod 0644 dist/install.sh dist/install.ps1
          sh -n dist/install.sh
          target="$(sh dist/install.sh --print-target)"
          dry_install_dir="$RUNNER_TEMP/volicord-stamped-install-dry-run-$$"
          dry_output="$RUNNER_TEMP/volicord-stamped-install-dry-run.txt"
          env -u VOLICORD_RELEASE_BASE_URL -u VOLICORD_REPO -u VOLICORD_VERSION sh dist/install.sh --dry-run --install-dir "$dry_install_dir" > "$dry_output"
          grep -F "release asset URL: $release_base_url/volicord-$target.tar.gz" "$dry_output"
          grep -F "$release_base_url" dist/install.ps1
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("dist/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -ne 0) { throw ($errors | Out-String) }'
          fi
          test ! -e "$dry_install_dir"
          (cd dist && sha256sum volicord-source.zip > volicord-source.zip.sha256)
          (cd dist && cat *.sha256 > volicord-checksums.txt)

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Volicord $tag"
          fi
          gh release upload "$tag" dist/*
