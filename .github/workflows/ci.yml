name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  checks:
    name: Workspace Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run documentation checks
        run: cargo run --locked -p xtask -- docs-check

      - name: Run maintainability report
        run: cargo run --locked -p xtask -- maintainability-report

      - name: Check public contract snapshots
        run: cargo test --locked -p volicord-integration-tests --test public_contract_snapshots

      - name: Check storage DDL contract
        run: cargo test --locked -p volicord-store --test storage_ddl_contract

      - name: Check MCP stdio contract
        run: cargo test --locked -p volicord-cli --test mcp_transport

      - name: Check MCP Agent Connection contract
        run: cargo test --locked -p volicord-integration-tests --test mcp_connection

      - name: Check Codex release manifest contract
        run: cargo test --locked -p volicord-release-validation-tests --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  host-hook-capability-native-windows:
    name: Host-hook capability unit tests (native Windows; not release-cell evidence)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Check platform-independent capability generation
        run: cargo test --locked -p volicord-cli successfully_returned_plan_generates_an_exact_current_capability --lib

      - name: Check strict executable requirements
        run: cargo test --locked -p volicord-types exact_record_capability_requires_executable_only_for_dispatch_and_wrappers --lib

  codex-release-cell-contracts:
    name: Codex ${{ matrix.target_triple }} / ${{ matrix.platform_environment }} definition (static only; never a cell pass)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_triple: x86_64-unknown-linux-gnu
            platform_environment: linux
            os: ubuntu-24.04
            test: platform_contract_linux
          - target_triple: aarch64-unknown-linux-gnu
            platform_environment: linux
            os: ubuntu-24.04-arm
            test: platform_contract_linux
          - target_triple: aarch64-apple-darwin
            platform_environment: macos
            os: macos-15
            test: platform_contract_macos
          - target_triple: x86_64-apple-darwin
            platform_environment: macos
            os: macos-15-intel
            test: platform_contract_macos
          - target_triple: x86_64-pc-windows-msvc
            platform_environment: native_windows
            os: windows-2022
            test: platform_contract_native_windows
          - target_triple: x86_64-unknown-linux-gnu
            platform_environment: wsl2
            os: ubuntu-24.04
            test: platform_contract_wsl2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Validate the static definition without executing or recording a platform cell
        run: cargo test --locked -p volicord-release-validation-tests --lib "tests::${{ matrix.test }}" -- --exact
