name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/volicord-release-smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "crates/volicord-cli/**"
      - "crates/volicord-mcp-protocol/**"
      - "crates/volicord-test-process/**"
      - "crates/volicord-types/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "tests/release-smoke/**"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/volicord-release-smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "crates/volicord-cli/**"
      - "crates/volicord-mcp-protocol/**"
      - "crates/volicord-test-process/**"
      - "crates/volicord-types/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "tests/release-smoke/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  checks:
    name: Workspace Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"
          rustup component add rustfmt clippy

      - name: Run current Linux repository validation plan
        run: cargo run --locked -p xtask -- validate final --base HEAD

  mutation-lease-stability:
    name: Mutation lease stability (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Repeat mutation lease process isolation
        shell: bash
        env:
          MUTATION_LEASE_STABILITY_ITERATIONS: "20"
        run: |
          set -o pipefail
          mkdir -p target/mutation-lease-stability
          iteration=1
          while [ "$iteration" -le "$MUTATION_LEASE_STABILITY_ITERATIONS" ]; do
            log_path="target/mutation-lease-stability/iteration-${iteration}.log"
            echo "mutation-lease stability iteration ${iteration}/${MUTATION_LEASE_STABILITY_ITERATIONS}"
            if cargo test --locked -p volicord-platform-fs --test mutation_lease_process 2>&1 | tee "$log_path"; then
              iteration=$((iteration + 1))
            else
              status=$?
              echo "mutation-lease stability failed at iteration ${iteration}" | tee -a "$log_path"
              exit "$status"
            fi
          done

      - name: Preserve mutation lease stability logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-lease-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/mutation-lease-stability/
          if-no-files-found: ignore

  operational-host-native-platforms:
    name: Operational host tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native Windows
            os: windows-2022
          - platform: macOS
            os: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Check operational session storage
        run: cargo test --locked -p volicord-store --test operational_sessions

      - name: Check managed launch leases
        run: cargo test --locked -p volicord-store managed_launch_leases::tests

      - name: Check Guard manifest projection
        run: cargo test --locked -p volicord-cli manifest_preserves_policy_and_runtime_command_forms_without_status_state --lib

      - name: Check shell-neutral Connection command guidance
        run: cargo test --locked -p volicord-cli connection_user_guidance --lib

      - name: Check initialization and Guard managed files
        run: cargo test --locked -p volicord-cli --test init_record_regression

      - name: Check operational host process behavior
        run: cargo test --locked -p volicord-cli --test operational_host_e2e

      - name: Check native platform process behavior
        run: cargo test --locked -p volicord-platform-process --test platform_process

      - name: Check native platform filesystem behavior
        run: cargo test --locked -p volicord-platform-fs

      - name: Check native bounded test process behavior
        run: cargo test --locked -p volicord-test-process

      - name: Check binary report behavior
        run: cargo test --locked -p volicord-cli --test binary_admin
