name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  checks:
    name: Workspace Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run documentation checks
        run: cargo run --locked -p xtask -- docs-check

      - name: Check pinned MCP specification fixtures
        run: cargo run --locked -p xtask -- mcp-spec-check

      - name: Check registry-driven MCP protocol conformance
        run: cargo test --locked -p volicord-mcp --test protocol_conformance

      - name: Run maintainability report
        run: cargo run --locked -p xtask -- maintainability-report

      - name: Check public contract snapshots
        run: cargo test --locked -p volicord-integration-tests --test public_contract_snapshots

      - name: Check storage DDL contract
        run: cargo test --locked -p volicord-store --test storage_ddl_contract

      - name: Check MCP stdio contract
        run: cargo test --locked -p volicord-cli --test mcp_transport

      - name: Check MCP Agent Connection contract
        run: cargo test --locked -p volicord-integration-tests --test mcp_connection

      - name: Build local Volicord binary for smoke validation
        run: cargo build --locked -p volicord-cli --bin volicord

      - name: Smoke test local Volicord binary
        run: cargo run --locked -p xtask -- release-binary-smoke --bin target/debug/volicord

      - name: Check release integrity
        run: cargo test --locked -p volicord-release-integrity-tests --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  operational-host-native-windows:
    name: Operational host tests (native Windows)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Check operational session storage
        run: cargo test --locked -p volicord-store --test operational_sessions

      - name: Check managed launch leases
        run: cargo test --locked -p volicord-store managed_launch_leases::tests

      - name: Check managed host launcher
        run: cargo test --locked -p volicord-cli --test operational_host_e2e

      - name: Check Guard manifest projection
        run: cargo test --locked -p volicord-cli manifest_preserves_policy_and_runtime_command_forms_without_status_state --lib

      - name: Check shell-neutral Connection command guidance
        run: cargo test --locked -p volicord-cli connection_user_guidance --lib

      - name: Check initialization and Guard managed files
        run: cargo test --locked -p volicord-cli --test init_record_regression

      - name: Check operational host process behavior
        run: cargo test --locked -p volicord-cli --test operational_host_e2e

      - name: Check native platform process behavior
        run: cargo test --locked -p volicord-platform-process --test platform_process

      - name: Check binary report behavior
        run: cargo test --locked -p volicord-cli --test binary_admin
