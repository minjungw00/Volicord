name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  checks:
    name: Workspace Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run documentation checks
        run: cargo run --locked -p xtask -- docs-check

      - name: Run maintainability report
        run: cargo run --locked -p xtask -- maintainability-report

      - name: Check public contract snapshots
        run: cargo test --locked -p volicord-integration-tests --test public_contract_snapshots

      - name: Check storage DDL contract
        run: cargo test --locked -p volicord-store --test storage_ddl_contract

      - name: Check MCP stdio contract
        run: cargo test --locked -p volicord-cli --test mcp_transport

      - name: Check MCP Agent Connection contract
        run: cargo test --locked -p volicord-integration-tests --test mcp_connection

      - name: Check release integrity
        run: cargo test --locked -p volicord-release-integrity-tests --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  host-hook-capability-native-windows:
    name: Host-hook capability unit tests (native Windows)
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Check platform-independent capability generation
        run: cargo test --locked -p volicord-cli successfully_returned_plan_generates_an_exact_current_capability --lib

      - name: Check strict executable requirements
        run: cargo test --locked -p volicord-types exact_record_capability_requires_executable_only_for_dispatch_and_wrappers --lib
