name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.85.0"

jobs:
  checks:
    name: Workspace Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run documentation checks
        run: cargo run --locked -p xtask -- docs-check

      - name: Run maintainability report
        run: cargo run --locked -p xtask -- maintainability-report

      - name: Check public contract snapshots
        run: cargo test --locked -p volicord-integration-tests --test public_contract_snapshots

      - name: Check storage DDL contract
        run: cargo test --locked -p volicord-store --test storage_ddl_contract

      - name: Check MCP stdio contract
        run: cargo test --locked -p volicord-cli --test mcp_transport

      - name: Check MCP Agent Connection contract
        run: cargo test --locked -p volicord-integration-tests --test mcp_connection

      - name: Check Codex release manifest contract
        run: cargo test --locked -p volicord-release-validation-tests --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  codex-release-cell-contracts:
    name: Codex ${{ matrix.platform }} static contract only (no live evidence)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            test: platform_contract_linux
          - platform: macos
            os: macos-15
            test: platform_contract_macos
          - platform: native_windows
            os: windows-2022
            test: platform_contract_native_windows
          - platform: wsl2
            os: ubuntu-24.04
            test: platform_contract_wsl2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "${{ env.RUST_VERSION }}" --profile minimal
          rustup default "${{ env.RUST_VERSION }}"

      - name: Validate static cell definition without recording release evidence
        run: cargo test --locked -p volicord-release-validation-tests --lib "tests::${{ matrix.test }}" -- --exact
