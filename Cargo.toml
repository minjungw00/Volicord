[workspace.metadata.architecture.packages.volicord-mcp]
group = "mcp-adapter"
description = "MCP lifecycle, canonical AgentToolId registry, compact tagged-workflow and rejection projection, session binding, shaping/advance dispatch, and Core invocation adaptation."
description_ko = "MCP 생명주기, 정규 AgentToolId registry, 간결한 태그 기반 workflow 및 rejection projection, 세션 결속, shaping/advance dispatch, Core 호출 adapter를 담당합니다."
kind = "adapter"
production = true
boundary = "adapter"
