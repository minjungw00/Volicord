    "volicord-core",
    "volicord-host-contract",
    "volicord-mcp-protocol",
    "volicord-mcp-wire",
    "volicord-platform-fs",
    "volicord-store",
    "volicord-types",
    "volicord-user-action-presentation",
    "volicord-user-action-service",
]
development = ["volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-cli]
group = "cli-adapter"
description = "Administrative CLI, typed User Channel resolution, Guard lifecycle observation/terminalization, managed tagged-workflow guidance, Codex setup, rendering, and MCP supervision."
description_ko = "관리 CLI, typed User Channel resolution, Guard lifecycle 관찰과 terminalization, 관리형 태그 기반 workflow 지침, Codex 설정, rendering, MCP 감독을 담당합니다."
kind = "adapter"
production = true
