[workspace]
members = [
    "crates/volicord-host-contract",
    "crates/volicord-mcp-protocol",
    "crates/volicord-mcp-wire",
    "crates/volicord-types",
    "crates/volicord-store",
    "crates/volicord-user-action-service",
    "crates/volicord-core",
    "crates/volicord-command-model",
    "crates/volicord-user-action-presentation",
    "crates/volicord-cli",
    "crates/volicord-mcp",
    "crates/volicord-platform-fs",
    "crates/volicord-platform-process",
    "crates/volicord-test-process",
    "crates/volicord-test-support",
    "tests/conformance",
    "tests/agent-evaluation",
    "tests/integration",
    "tests/release-integrity",
    "tests/release-smoke",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.9.1"

[workspace.metadata.architecture.packages.volicord-types]
group = "shared-types"
description = "Dependency-safe shared schemas, identifiers, closed values, canonical encodings, platform-neutral path values, and adapter-neutral domain facts."
description_ko = "의존 안전한 공유 스키마, 식별자, 폐쇄형 값, 정규 인코딩, 플랫폼 중립 경로 값, 어댑터 중립 도메인 사실을 담당합니다."
kind = "schema"
production = true
boundary = "core-facing"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-host-contract]
group = "host-contract"
description = "Dependency-safe semantic host contracts and typed host correlation identities."
description_ko = "의존 안전한 의미 기반 호스트 계약과 타입이 있는 호스트 상관관계 식별자를 담당합니다."
kind = "schema"
production = true
boundary = "core-facing"
normal = ["volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-mcp-protocol]
group = "mcp-protocol"
description = "Host-independent MCP revision profiles and semantic capability registry."
description_ko = "호스트 독립 MCP 리비전 프로필과 의미 기반 역량 레지스트리를 담당합니다."
kind = "schema"
production = true
boundary = "neutral"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-mcp-wire]
group = "mcp-wire"
description = "MCP request, result, error, structured-content, JSON-RPC envelope, and generated wire-schema ownership."
description_ko = "MCP 요청, 결과, 오류, 구조화 콘텐츠, JSON-RPC 엔벌로프, 생성 wire 스키마를 담당합니다."
kind = "schema"
production = true
boundary = "adapter"
normal = ["volicord-mcp-protocol", "volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-store]
group = "storage"
description = "Canonical persistence, Runtime Home mechanics, strict decoding, and transaction application."
description_ko = "정규 영속화, Runtime Home 메커니즘, 엄격한 디코딩, 트랜잭션 적용을 담당합니다."
kind = "infrastructure"
production = true
boundary = "core-facing"
normal = [
    "volicord-host-contract",
    "volicord-platform-fs",
    "volicord-types",
]
development = ["volicord-platform-fs", "volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-platform-fs]
group = "platform-filesystem"
description = "Product Repository and platform filesystem observation, publication, mutation admission, and Git layout primitives."
description_ko = "Product Repository 및 플랫폼 파일시스템 관찰, 게시, 변경 승인, Git 레이아웃 프리미티브를 담당합니다."
kind = "infrastructure"
production = true
boundary = "core-facing"
normal = ["volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-test-support]
group = "test-support"
description = "Reusable disposable Runtime Home, Store, Core request, and Agent Connection fixtures."
description_ko = "재사용 가능한 폐기형 Runtime Home, Store, Core 요청, Agent Connection 픽스처를 담당합니다."
kind = "test-support"
production = false
boundary = "neutral"
normal = [
    "volicord-host-contract",
    "volicord-platform-fs",
    "volicord-store",
    "volicord-types",
]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-user-action-service]
group = "user-action-service"
description = "UserAction validation, authority, lifecycle, persistence mapping, resolution, continuity, and semantic projection."
description_ko = "UserAction 검증, 권한, 생명주기, 영속화 매핑, 해결, 연속성, 의미 투영을 담당합니다."
kind = "application"
production = true
boundary = "core-facing"
normal = ["volicord-store", "volicord-types"]
development = ["volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-core]
group = "core"
description = "Adapter-independent request orchestration, policy evaluation, method planning, and atomic commit coordination."
description_ko = "어댑터 독립 요청 조율, 정책 평가, 메서드 계획, 원자적 커밋 조율을 담당합니다."
kind = "application"
production = true
boundary = "core"
normal = [
    "volicord-platform-fs",
    "volicord-store",
    "volicord-types",
    "volicord-user-action-service",
]
development = ["volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-command-model]
group = "command-model"
description = "Execution-free administrative command declaration, syntax model, and canonical invocation builders."
description_ko = "실행과 분리된 관리 명령 선언, 문법 모델, 정규 호출 빌더를 담당합니다."
kind = "schema"
production = true
boundary = "neutral"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-user-action-presentation]
group = "user-action-presentation"
description = "Typed CLI UserAction presentation, JSON Schemas, and command-model-backed recovery instructions."
description_ko = "타입이 있는 CLI UserAction 표현, JSON Schema, 명령 모델 기반 복구 안내를 담당합니다."
kind = "presentation"
production = true
boundary = "adapter"
normal = ["volicord-command-model", "volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-mcp]
