[workspace]
members = [
    "crates/volicord-host-contract",
    "crates/volicord-mcp-protocol",
    "crates/volicord-mcp-wire",
    "crates/volicord-types",
    "crates/volicord-store",
    "crates/volicord-user-action-service",
    "crates/volicord-core",
    "crates/volicord-command-model",
    "crates/volicord-user-action-presentation",
    "crates/volicord-cli",
    "crates/volicord-mcp",
    "crates/volicord-platform-fs",
    "crates/volicord-platform-process",
    "crates/volicord-test-process",
    "crates/volicord-test-support",
    "tests/conformance",
    "tests/agent-evaluation",
    "tests/integration",
    "tests/release-integrity",
    "tests/release-smoke",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.9.1"

[workspace.metadata.architecture.packages.volicord-types]
group = "shared-types"
description = "Dependency-safe public schemas and closed values, including first-class shaping checkpoints, tagged workflow progression, typed workflow rejection, canonical encodings, and platform-neutral facts."
description_ko = "일급 shaping checkpoint, 태그 기반 workflow 진행, typed workflow rejection, 정규 인코딩, 플랫폼 중립 fact를 포함하는 의존 안전한 공개 스키마와 폐쇄형 값을 담당합니다."
kind = "schema"
production = true
boundary = "core-facing"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-host-contract]
group = "host-contract"
description = "Dependency-safe host contracts for exact Guard hook correlation and prospective effect classification, without user or Core progression authority."
description_ko = "사용자 권한이나 Core 진행 권한을 만들지 않고 정확한 Guard hook 상관관계와 예상 효과 분류를 제공하는 의존 안전한 host contract를 담당합니다."
kind = "schema"
production = true
boundary = "core-facing"
normal = ["volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-mcp-protocol]
group = "mcp-protocol"
description = "Host-independent MCP revision profiles and semantic capability registry."
description_ko = "호스트 독립 MCP 리비전 프로필과 의미 기반 역량 레지스트리를 담당합니다."
kind = "schema"
production = true
boundary = "neutral"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-mcp-wire]
group = "mcp-wire"
description = "MCP shaping and advance arguments/results, tagged workflow presentation shapes, errors, structured content, JSON-RPC envelopes, and generated wire schemas."
description_ko = "MCP shaping 및 advance 인자와 결과, 태그 기반 workflow presentation 형태, 오류, 구조화 콘텐츠, JSON-RPC envelope, 생성 wire schema를 담당합니다."
kind = "schema"
production = true
boundary = "adapter"
normal = ["volicord-mcp-protocol", "volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-store]
group = "storage"
description = "Canonical Runtime Home persistence, strict shaping-aggregate and persisted-row decoding, atomic checkpoint/UserAction/phase transitions, and invariant-preserving transaction application."
description_ko = "정규 Runtime Home 영속화, shaping aggregate와 영속 row의 엄격한 디코딩, 원자적 checkpoint/UserAction/단계 전이, 불변 조건을 보존하는 transaction 적용을 담당합니다."
kind = "infrastructure"
production = true
boundary = "core-facing"
normal = [
    "volicord-host-contract",
    "volicord-platform-fs",
    "volicord-types",
]
development = ["volicord-platform-fs", "volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-platform-fs]
group = "platform-filesystem"
description = "Invocation-scoped Product Repository observation, platform filesystem observation, publication, mutation admission, and Git layout primitives."
description_ko = "호출 범위 Product Repository 관찰, 플랫폼 파일시스템 관찰, 게시, 변경 승인, Git 레이아웃 프리미티브를 담당합니다."
kind = "infrastructure"
production = true
boundary = "core-facing"
normal = ["volicord-platform-process", "volicord-types"]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-test-support]
group = "test-support"
description = "Reusable disposable Runtime Home, Store, Core request, and Agent Connection fixtures."
description_ko = "재사용 가능한 폐기형 Runtime Home, Store, Core 요청, Agent Connection 픽스처를 담당합니다."
kind = "test-support"
production = false
boundary = "neutral"
normal = [
    "volicord-host-contract",
    "volicord-platform-fs",
    "volicord-store",
    "volicord-types",
]
development = []
build = []

[workspace.metadata.architecture.packages.volicord-user-action-service]
group = "user-action-service"
description = "Semantic UserAction construction, validation, authority, lifecycle, shaping-link identity, persistence mapping, resolution, continuity, and projection from Store-validated records."
description_ko = "의미 기반 UserAction 구성, 검증, 권한, 생명주기, shaping link identity, 영속화 매핑, 해결, 연속성, Store가 검증한 record 기반 투영을 담당합니다."
kind = "application"
production = true
boundary = "core-facing"
normal = ["volicord-store", "volicord-types"]
development = ["volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-core]
group = "core"
description = "Adapter-independent record_shaping and advance_task orchestration, tagged workflow projection, typed recovery, policy evaluation, method planning, and atomic commit coordination."
description_ko = "어댑터 독립 record_shaping 및 advance_task 조율, 태그 기반 workflow projection, typed recovery, 정책 평가, 메서드 계획, 원자적 커밋 조율을 담당합니다."
kind = "application"
production = true
boundary = "core"
normal = [
    "volicord-platform-fs",
    "volicord-store",
    "volicord-types",
    "volicord-user-action-service",
]
development = ["volicord-test-support"]
build = []

[workspace.metadata.architecture.packages.volicord-command-model]
group = "command-model"
description = "Execution-free administrative command declaration, syntax model, and canonical invocation builders."
description_ko = "실행과 분리된 관리 명령 선언, 문법 모델, 정규 호출 빌더를 담당합니다."
kind = "schema"
production = true
boundary = "neutral"
normal = []
development = []
build = []

[workspace.metadata.architecture.packages.volicord-user-action-presentation]
group = "user-action-presentation"
description = "Typed User Channel presentation, CLI JSON Schemas, chat-nonauthority boundaries, and command-model-backed resolution instructions."
description_ko = "typed User Channel presentation, CLI JSON Schema, 대화 비권한 경계, 명령 모델 기반 resolution 안내를 담당합니다."
kind = "presentation"
production = true
boundary = "adapter"
normal = ["volicord-command-model", "volicord-types"]
development = []
