description = "MCP lifecycle, transport, tool projection, session binding, and Core invocation adapter."
description_ko = "MCP 생명주기, 전송, 도구 투영, 세션 결속, Core 호출 어댑터를 담당합니다."
kind = "adapter"
production = true
boundary = "adapter"
normal = [
    "volicord-core",
    "volicord-host-contract",
    "volicord-mcp-protocol",
    "volicord-mcp-wire",
    "volicord-platform-fs",
    "volicord-store",
