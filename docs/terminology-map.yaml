avoid:
  en:
    - phrase: "Volicord is a local authority record"
      use: "Volicord is the local work authority record for AI-assisted product work; route exact internal authority structure to Core Model."
    - phrase: "work-authority system"
      use: "work authority record"
    - phrase: "work authority system"
      use: "work authority record"
    - phrase: "authority layer"
      use: "work authority record in public prose; use exact reference-owner terms only in Reference or Architecture Guide documents."
    - phrase: "authority ledger"
      use: "work authority record"
    - phrase: "authority-record layer"
      use: "work authority record in public prose; use exact architecture terms only in Reference or Architecture Guide documents."
    - phrase: "permission system"
      use: "work authority record; do not describe Volicord as a permission or enforcement system."
    - phrase: "Close Readiness"
      use: "Close Status in README and user guide, and user-facing output; preserve exact close-readiness identifiers only where reference or schema precision requires them."
    - phrase: "Close Basis"
      use: "Close Status in user-facing prose, or visible close facts when naming the displayed support."
    - phrase: "Close Result"
      use: "Close Status"
    - phrase: "Close Outcome"
      use: "Close Status"
    - phrase: "ArtifactRef"
      use: "Evidence input or Evidence attachment in user-facing prose; preserve `ArtifactRef` only as an exact schema identifier."
    - phrase: "artifact ref"
      use: "Evidence input or Evidence attachment"
    - phrase: "staged artifact"
      use: "Evidence input or Evidence attachment in user-facing prose; preserve exact staged-artifact identifiers only in schema/reference contexts."
    - phrase: "Change Finding"
      use: "Unrecorded Change when user-visible."
    - phrase: "Finding"
      use: "Unrecorded Change when user-visible."
    - phrase: "Prompt Capture"
      use: "Guard observation label only; never a UserAction resolution path."
    - phrase: "CLI Answer"
      use: "User Channel input method or CLI inbox."
    - phrase: "Control Surface"
      use: "observation summary in user-facing prose; preserve exact schema/internal names only in reference or implementation contexts."
    - phrase: "local work-authority server"
      use: "local work authority record for Volicord; for implementation context use Volicord implementation, Volicord source repository, Volicord Rust workspace, Volicord installation, `volicord`, or `volicord mcp --stdio` as applicable."
    - phrase: "coding-agent integration"
      use: "agent-host integration, Agent Connection, managed host configuration state, or agent connection according to context."
    - phrase: "MCP config export"
      use: "authority bundle export for public export behavior; user-managed external host configuration for host-neutral MCP setup boundaries."
    - phrase: "Volicord-as-server product label"
      use: "Volicord, Volicord implementation, Volicord source repository, Volicord Rust workspace, Volicord installation, `volicord`, or `volicord mcp --stdio` according to context."
    - phrase: "server implementation set"
      use: "implementation set maintained by this repository."
    - phrase: "server files"
      use: "implementation files, source-repository files, installation files, or installation location according to context."
    - phrase: "server installation storage"
      use: "Volicord installation location or executable installation according to context; do not use for `Volicord Runtime Home` by default."
    - phrase: "active scope"
      use: "current scope or currently applied scope, except when preserving an exact identifier or status value."
    - phrase: "active Change Unit"
      use: "current Change Unit or currently applied Change Unit, except when preserving an exact identifier such as `active_change_unit_ref`."
    - phrase: "active connection context"
      use: "current connection context or currently applied connection context."
    - phrase: "verification expectations"
      use: "verification criteria when the meaning is user-visible criteria for checking work."
    - phrase: "inspection expectations"
      use: "verification criteria when the meaning is user-visible criteria for checking work."
