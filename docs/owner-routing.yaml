validation_classes:
  architecture: Workspace package declarations, placement, and dependency-direction checks.
  documentation: Maintained-document metadata, structure, links, terminology, parity, and generated-region checks.
  mcp-spec: Pinned MCP specification manifest and fixture checks.
  release: Release packaging, source-bundle, smoke, and integrity checks.
  repository-hygiene: Diff, tracked-artifact, and generated-output hygiene checks.
  rust: Formatting, lint, and changed-package Rust checks.
  workflow: Parsed CI, release-workflow, and reusable-action checks.

instruction_scopes:
  - path_prefix: ""
    instruction: AGENTS.md
  - path_prefix: "crates/"
    instruction: crates/AGENTS.md
  - path_prefix: "docs/"
    instruction: docs/AGENTS.md
  - path_prefix: "tests/"
    instruction: crates/AGENTS.md
  - path_prefix: "xtask/"
    instruction: crates/AGENTS.md

path_routes:
  - path: AGENTS.md
    owner_doc_ids:
      - maintain.documentation-policy
      - maintain.validation
    validation_classes:
      - documentation
      - repository-hygiene
  - path: crates/AGENTS.md
    owner_doc_ids:
      - architecture-guide.change-guide
      - architecture-guide.testing-strategy
      - maintain.validation
    validation_classes:
      - documentation
      - repository-hygiene
  - path: Cargo.lock
    owner_doc_ids:
      - architecture-guide.architecture
      - architecture-guide.change-guide
      - architecture-guide.testing-strategy
      - maintain.validation
    validation_classes:
      - repository-hygiene
      - rust
  - path: Cargo.toml
    owner_doc_ids:
      - architecture-guide.architecture
      - architecture-guide.change-guide
      - architecture-guide.testing-strategy
      - maintain.validation
    validation_classes:
      - architecture
      - documentation
      - repository-hygiene
      - rust
  - path: README.md
    owner_doc_ids:
      - maintain.documentation-policy
      - maintain.translation-policy
      - maintain.validation
    validation_classes:
      - documentation
      - repository-hygiene
  - path: README.ko.md
    owner_doc_ids:
      - maintain.documentation-policy
      - maintain.translation-policy
      - maintain.validation
    validation_classes:
      - documentation
      - repository-hygiene
  - path: .gitignore
    owner_doc_ids:
      - maintain.validation
    validation_classes:
      - repository-hygiene
  - path_prefix: ".github/"
    owner_doc_ids:
      - architecture-guide.testing-strategy
      - maintain.validation
    validation_classes:
      - release
      - repository-hygiene
      - workflow
  - path_prefix: "docs/"
    owner_doc_ids:
      - docs.doc-index
      - maintain.documentation-policy
      - maintain.translation-policy
      - maintain.validation
    validation_classes:
      - documentation
      - repository-hygiene
  - path_prefix: "scripts/"
    owner_doc_ids:
      - architecture-guide.testing-strategy
      - maintain.validation
    validation_classes:
      - release
      - repository-hygiene
  - path: xtask/src/architecture.rs
    owner_doc_ids:
      - architecture-guide.architecture
      - architecture-guide.testing-strategy
    validation_classes:
      - architecture
      - documentation
  - path: xtask/src/owner_route.rs
    owner_doc_ids:
      - docs.doc-index
      - maintain.validation
    validation_classes:
      - architecture
      - documentation
  - path: xtask/src/source_bundle.rs
    owner_doc_ids:
      - maintain.validation
    validation_classes:
      - release
  - path_prefix: "xtask/src/mcp_spec/"
    owner_doc_ids:
      - reference.external-contracts
      - reference.mcp-transport
    validation_classes:
      - mcp-spec

package_defaults:
  instruction_paths:
    - crates/AGENTS.md
  owner_doc_ids:
    - architecture-guide.architecture
    - architecture-guide.change-guide
    - architecture-guide.testing-strategy
    - maintain.validation
  validation_classes:
    - repository-hygiene
    - rust

