[package]
name = "volicord-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "volicord-viewer"
path = "src/main.rs"

[dependencies]
sha2 = "0.10.9"
serde_json = "1.0"
getrandom = { version = "0.3.4", features = ["std"] }
volicord-context = { path = "../volicord-context" }
volicord-operations = { path = "../volicord-operations" }
volicord-projections = { path = "../volicord-projections" }
volicord-repository-intelligence = { path = "../volicord-repository-intelligence" }

[dev-dependencies]
volicord-inquiry = { path = "../volicord-inquiry" }
volicord-privacy = { path = "../volicord-privacy" }
volicord-host = { path = "../volicord-host" }
rustix = { version = "1.1.4", features = ["net"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tempfile = "3.20.0"

[lints]
workspace = true
