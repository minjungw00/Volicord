[package]
name = "volicord-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "volicord"
path = "src/main.rs"

[dependencies]
getrandom = { version = "0.3.4", features = ["std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
volicord-context = { path = "../volicord-context" }
volicord-inquiry = { path = "../volicord-inquiry" }
volicord-local-platform = { path = "../volicord-local-platform" }
volicord-privacy = { path = "../volicord-privacy" }
volicord-projections = { path = "../volicord-projections" }
volicord-repository-intelligence = { path = "../volicord-repository-intelligence" }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
