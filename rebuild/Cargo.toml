[workspace]
members = [
    "crates/volicord-context",
    "crates/volicord-host",
    "crates/volicord-inquiry",
    "crates/volicord-local-platform",
    "crates/volicord-operations",
    "crates/volicord-privacy",
    "crates/volicord-projections",
    "crates/volicord-repository-intelligence",
    "crates/volicord-viewer",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep the bounded native layout engine optimized in development and tests;
# its input, memory, stack, job, output and deadline limits stay unchanged.
[profile.dev.package.rquickjs-sys]
opt-level = 2
